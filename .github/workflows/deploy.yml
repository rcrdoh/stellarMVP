name: Deploy to Vercel

on:
  push:
    branches: [main, dev, coding_agent/agentic-commerce]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellarmvp_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stellarmvp_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stellarmvp_smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js for Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run migrations against ephemeral Postgres
        run: bun run db:smoke
      - name: Validate service
        run: |
          bun run spec:check
          bun test
          bun run check-types
          bun run check
      - name: Verify Docker build
        run: docker build -t stellarmvp-verify .

  deploy:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js for Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"
      - name: Build preview
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Build production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy preview
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
