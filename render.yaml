# Render Blueprint for stellarmvp.
#
# A single Docker web service from this repository runs both the Fastify API
# and the React ACP x402 SPA (which proxies `/v1/*` to the API) inside one
# container via `bun run start:all` (see `./Dockerfile`).
#
# The API binds an internal port (`API_PORT`, default 3000, localhost only) and
# the web server binds Render's injected `PORT`, so the public origin serves the
# page and the API on the same host and no CORS is needed.
#
# Deploy from the Render Dashboard: New > Blueprint > select this repo, or
# `render blueprint launch`. Values marked `sync: false` are NOT stored in git;
# set them in the Dashboard after the first deploy.

services:
  - type: web
    name: stellarmvp
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT for the public web server; the API uses API_PORT.
      - key: API_PORT
        value: "3000"
      - key: API_HOST
        value: 127.0.0.1
      - key: LOG_LEVEL
        value: info
      - key: CONFIG_FILE
        value: config/settings.toml

      # "0" uses the real HTTP clients; anything else keeps mock mode.
      - key: REACT_MOCK_MODE
        value: "0"
      # Inlined into the bundle at build time: changing these requires a
      # redeploy of this service.
      - key: REACT_AGENT_TOKEN
        sync: false
      - key: REACT_SERVICE_TOKEN
        sync: false
      - key: REACT_PRINCIPAL_ID
        sync: false

      # --- Optional integrations (disabled by default) --------------------
      - key: DATABASE_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: BUCKET_ENABLED
        value: "false"
      - key: CACHE_ENABLED
        value: "false"
      - key: REDIS_URL
        sync: false

      # --- Agentic commerce (ACP x402) ------------------------------------
      # Set to "true" only when every required integration below is provided,
      # otherwise the API fails to boot while building the runtime.
      - key: AGENT_COMMERCE_ENABLED
        value: "false"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: items
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDINGS_MODEL
        value: text-embedding-3-small
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: JEV_API_KEY
        sync: false
      - key: JEV_BASE_URL
        value: https://api.typesafe.ai
      - key: JEV_MODEL
        value: jev-latest

      # --- Stellar payments -----------------------------------------------
      # With PAYMENTS_ENABLED=true the schema REQUIRES SERVICE_TOKEN,
      # DATABASE_URL, STELLAR_NETWORK=testnet, STELLAR_USDC_ISSUER and
      # STELLAR_HORIZON_URL; a missing value aborts startup with a ZodError.
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: SERVICE_TOKEN
        generateValue: true
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_USDC_ISSUER
        sync: false
      - key: STELLAR_SOURCE_SECRET
        sync: false
      - key: STELLAR_MAX_FEE_PER_OPERATION_STROOPS
        value: "100000"
