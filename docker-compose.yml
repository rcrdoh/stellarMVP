services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: stellar
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stellarmvp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellar -d stellarmvp"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  stellarmvp:
    build:
      context: .
    environment:
      APP_ENV: prod
      HOST: 0.0.0.0
      PORT: 3000
      CONFIG_FILE: config/settings.toml
      DATABASE_URL: postgres://stellar:password@postgres:5432/stellarmvp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8010:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "await fetch('http://127.0.0.1:3000/v1/health/live').then((r) => { if (!r.ok) process.exit(1) })",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
